<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style>
    .bg { fill: #0d1117; rx: 10px; }
    .bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: 'Fira Code', monospace; font-size: 14px; text-anchor: middle; }
    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; }
    .user { fill: #58a6ff; font-weight: bold; }
    .host { fill: #7ee787; font-weight: bold; }
    .crit { fill: #ff7b72; font-weight: bold; }
    .high { fill: #ffa657; font-weight: bold; }
    .info { fill: #a5d6ff; }
    .success { fill: #7ee787; }
    .normal { fill: #c9d1d9; }
    .comment { fill: #8b949e; }
  </style>
  
  <rect width="800" height="420" class="bg"/>
  
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 790,0 A 10,10 0 0,1 800,10 L 800,40 L 0,40 Z" class="bar"/>
  
  <circle cx="25" cy="20" r="6" class="dot-red"/>
  <circle cx="45" cy="20" r="6" class="dot-yellow"/>
  <circle cx="65" cy="20" r="6" class="dot-green"/>
  
  <text x="400" y="25" class="title">voltron999@security-dashboard:~</text>
  
  <g transform="translate(25, 70)">
    <text class="term-text">
      <tspan class="user">voltron999</tspan><tspan class="normal">@</tspan><tspan class="host">bounty-hunter</tspan><tspan class="normal">:~$ ./show_exploits.sh</tspan>
    </text>
    
    <text y="30" class="term-text info">[+] Querying validated high-impact security discoveries...</text>
    <text y="50" class="term-text comment">--------------------------------------------------------------------------------</text>
    
    <text y="80" class="term-text">
      <tspan class="crit">[CRITICAL] </tspan>
      <tspan class="normal">CVE-2026-25212 — Percona PMM Authenticated RCE (CVSS 9.9)</tspan>
    </text>
    
    <text y="110" class="term-text">
      <tspan class="high">[HIGH]     </tspan>
      <tspan class="normal">gVisor Mount Isolation Bypass — Container Escape (Issue #13481)</tspan>
    </text>
    
    <text y="140" class="term-text">
      <tspan class="high">[HIGH]     </tspan>
      <tspan class="normal">Go x/crypto/ssh — Terminal Escape Sequence Injection (Issue #80302)</tspan>
    </text>
    
    <text y="170" class="term-text">
      <tspan class="high">[HIGH]     </tspan>
      <tspan class="normal">CVE-2026-12681 — Google go-attestation EFI Hash Injection</tspan>
    </text>
    
    <text y="200" class="term-text comment">--------------------------------------------------------------------------------</text>
    
    <text y="230" class="term-text success">[✔] Total Validated Discoveries: 4</text>
    <text y="250" class="term-text info">[+] Status: Active Vulnerability Researching...</text>
    
    <text y="290" class="term-text">
      <tspan class="user">voltron999</tspan><tspan class="normal">@</tspan><tspan class="host">bounty-hunter</tspan><tspan class="normal">:~$ </tspan><tspan class="normal" fill="#ffffff">█</tspan>
    </text>
  </g>
</svg>
