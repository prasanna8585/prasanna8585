<svg xmlns="http://www.w3.org/2000/svg" width="600" height="395" viewBox="0 0 600 395">
  <defs>
    <style>
      .terminal { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0883e; }
      .success { fill: #3fb950; }
      .critical { fill: #f85149; font-weight: bold; }
      .high { fill: #f0883e; }
      .info { fill: #8b949e; }
      .border { fill: #21262d; }
      .title { fill: #8b949e; font-size: 11px; }
    </style>
  </defs>
  <rect width="600" height="395" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M0,8 A8,8 0 0,1 8,0 H592 A8,8 0 0,1 600,8 V30 H0 Z" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <circle cx="20" cy="15" r="6" fill="#f85149" /><circle cx="40" cy="15" r="6" fill="#f0883e" /><circle cx="60" cy="15" r="6" fill="#3fb950" />
  <text x="300" y="19" class="title" text-anchor="middle">voltron@sec-ops:~ (sh)</text>
  <g class="terminal" transform="translate(20, 55)">
    <text x="0" y="0"><tspan class="prompt">voltron@sec-ops:~$</tspan> <tspan class="cmd">./fetch-vulns.sh --disclosed</tspan></text>
    <text x="0" y="25" class="info">[i] Fetching vulnerability records from active platforms...</text>
    <text x="0" y="55" class="info">ID             | TARGET / VULNERABILITY                 | SEV / IMPACT</text>
    <text x="0" y="65" class="border">──────────────────────────────────────────────────────────────────────</text>

    <text x="0" y="90"><tspan class="critical">CVE-2026-25212</tspan> <tspan xml:space="preserve"> | Percona PMM Authenticated RCE          | </tspan><tspan class="critical">9.9 CRIT</tspan></text>
    <text x="0" y="115"><tspan class="high">CVE-2026-12681</tspan> <tspan xml:space="preserve"> | Google go-attestation TPM Injection    | </tspan><tspan class="high">8.9 HIGH</tspan></text>
    <text x="0" y="140"><tspan class="high">CVE-2026-46602</tspan> <tspan xml:space="preserve"> | Go x/image TIFF Unbounded Memory       | </tspan><tspan class="high">7.5 HIGH</tspan></text>
    <text x="0" y="165"><tspan class="high">GHSA-3238-... </tspan> <tspan xml:space="preserve"> | Google Project Oak Attestation Bypass  | </tspan><tspan class="high">TEE Bypass</tspan></text>
    <text x="0" y="190"><tspan class="success">gVisor (Goog) </tspan> <tspan xml:space="preserve"> | Container Mount Isolation Bypass       | </tspan><tspan class="success">Mount Esc</tspan></text>
    <text x="0" y="215"><tspan class="info">Trezor (BB)   </tspan> <tspan xml:space="preserve"> | xpub Amplification DoS                 | </tspan><tspan class="info">Res Exh</tspan></text>
    <text x="0" y="240"><tspan class="info">PowerDNS      </tspan> <tspan xml:space="preserve"> | eBPF DDoS Mitigation Logic Flaw        | </tspan><tspan class="info">Logic Flaw</tspan></text>
    <text x="0" y="280" class="border">──────────────────────────────────────────────────────────────────────</text>
    <text x="0" y="310" class="success">[✔] 7 active advisories synced successfully.</text>
    <text x="0" y="340"><tspan class="prompt">voltron@sec-ops:~$</tspan> <tspan class="cmd">_</tspan></text>
  </g>
</svg>