<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; rx: 10px; ry: 10px; }
    .header { fill: #161b22; rx: 10px; ry: 10px; }
    .title { fill: #8b949e; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .prompt { fill: #58a6ff; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .cve-id { fill: #ff7b72; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
    .target { fill: #79c0ff; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .impact { fill: #8b949e; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; }
    .border { stroke: #30363d; stroke-width: 1px; fill: none; rx: 10px; ry: 10px; }
    .bullet { fill: #d2a8ff; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .status { fill: #3fb950; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
  </style>

  <!-- Terminal Window -->
  <rect x="0" y="0" width="800" height="440" class="bg"/>
  <rect x="0" y="0" width="800" height="38" class="header"/>
  <rect x="0" y="28" width="800" height="10" fill="#161b22"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" class="title">prasanna@security-research: ~/cve-disclosures</text>
  <rect x="0" y="0" width="800" height="440" class="border"/>

  <!-- Content -->
  <g transform="translate(25, 65)">
    <!-- Prompt -->
    <text y="0">
      <tspan class="prompt">prasanna8585@sec-ops:~$</tspan>
      <tspan class="cmd"> ./list_active_cves.sh --verified</tspan>
    </text>

    <text y="22" fill="#30363d" font-family="monospace" font-size="12">-------------------------------------------------------------------------------</text>

    <!-- CVE 1 -->
    <text y="45">
      <tspan class="bullet">[+] </tspan>
      <tspan class="cve-id">CVE-2026-86840</tspan>
      <tspan class="cmd"> | </tspan>
      <tspan class="target">Bifrost Substrate Pallets</tspan>
    </text>
    <text y="63" class="impact">    └─ Missing Auth / Protocol Commission Hijack</text>

    <!-- CVE 2 -->
    <text y="95">
      <tspan class="bullet">[+] </tspan>
      <tspan class="cve-id">CVE-2026-80047</tspan>
      <tspan class="cmd"> | </tspan>
      <tspan class="target">Hugging Face Transformers</tspan>
    </text>
    <text y="113" class="impact">    └─ Pre-Consent Arbitrary File Write &amp; Cache Poisoning</text>

    <!-- CVE 3 -->
    <text y="145">
      <tspan class="bullet">[+] </tspan>
      <tspan class="cve-id">CVE-2026-46602</tspan>
      <tspan class="cmd"> | </tspan>
      <tspan class="target">Go Core Image (golang.org/x/image/tiff)</tspan>
    </text>
    <text y="163" class="impact">    └─ Unbounded Memory Allocation / OOM Denial of Service</text>

    <!-- CVE 4 -->
    <text y="195">
      <tspan class="bullet">[+] </tspan>
      <tspan class="cve-id">CVE-2026-25212</tspan>
      <tspan class="cmd"> | </tspan>
      <tspan class="target">Percona Monitoring &amp; Management (PMM)</tspan>
    </text>
    <text y="213" class="impact">    └─ Authenticated Remote Code Execution (RCE)</text>

    <!-- CVE 5 -->
    <text y="245">
      <tspan class="bullet">[+] </tspan>
      <tspan class="cve-id">CVE-2026-12681</tspan>
      <tspan class="cmd"> | </tspan>
      <tspan class="target">Google go-attestation</tspan>
    </text>
    <text y="263" class="impact">    └─ TEE Remote Attestation Validation Bypass</text>

    <text y="300" fill="#30363d" font-family="monospace" font-size="12">-------------------------------------------------------------------------------</text>
    <text y="322">
      <tspan class="status">[SUCCESS]</tspan>
      <tspan class="cmd"> 5 CVEs Active | All Official Advisories Published</tspan>
    </text>
  </g>
</svg>
