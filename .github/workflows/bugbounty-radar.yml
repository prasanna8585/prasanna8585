name: Generate Bug Bounty Radar

on:
  schedule:
    - cron: "0 0 * * *" # Updates automatically every day at midnight
  workflow_dispatch: # Allows you to run it manually anytime
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Radar SVG
        run: |
          python - <<'EOF'
          import os

          svg_content = """
            
            
            
              
                
                
                
              
            

            
            
            
            
            
            BUG_HUNTER_RECON_GRID // ACTIVE_SCAN
            
            
              
              
              
              
              
              
              
              
              
              
              
            
            
            
              
                [STG] Target scope initialization...
              
              
              
                [RECON] Discovering subdomains & API paths
              
              
              
                [FUZZ] Mapping logical parameters [IDOR/XSS]
              
              
              
                [⚠️] ALERT: Parameter vulnerability confirmed
                ↳ Exploit payload deployed successfully.
              
              
              
                [✔] STATUS: Bug captured & report filed
                ↳ Monitoring next asset pool...
              
            
          
          """
          
          os.makedirs('assets', exist_ok=True)
          with open('assets/bug-bounty-radar.svg', 'w', encoding='utf-8') as f:
              f.write(svg_content)
          print("Radar SVG successfully generated!")
          EOF

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bug-bounty-radar.svg
          git commit -m "Automated update: Bug Bounty Radar Graphic" || exit 0
          git push
