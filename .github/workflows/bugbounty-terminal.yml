name: Generate Bug Bounty Terminal

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Upgraded to clear Node deprecation warnings

      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to clear Node deprecation warnings
        with:
          python-version: '3.x'

      # OPTION A: If your Python script is inline inside the workflow file, use this block:
      # (If you are calling an external script like 'python generate.py', you can skip this part 
      # and just update the data array in that script file instead!)
      变换 name: Generate Updated Terminal SVG
        run: |
          cat << 'EOF' > generate_svg.py
          import os

          # Updated vulnerability database matrix
          vulns = [
              {"id": "CVE-2026-25212", "target": "Percona PMM Authenticated RCE", "sev": "9.9 CRIT", "style": "critical"},
              {"id": "CVE-2026-12681", "target": "Google go-attestation TPM Injection", "sev": "8.9 HIGH", "style": "high"},
              {"id": "CVE-2026-46602", "target": "Go x/image TIFF Unbounded Memory", "sev": "7.5 HIGH", "style": "high"},
              {"id": "GHSA-3238-...",  "target": "Google Project Oak Attestation Bypass", "sev": "TEE Bypass", "style": "high"},
              {"id": "gVisor (Goog)",  "target": "Container Mount Isolation Bypass", "sev": "Mount Esc", "style": "success"},
              {"id": "Trezor (BB)",    "target": "xpub Amplification DoS", "sev": "Res Exh", "style": "info"},
              {"id": "PowerDNS",       "target": "eBPF DDoS Mitigation Logic Flaw", "sev": "Logic Flaw", "style": "info"}
          ]

          # Expanded height to 395px to prevent collision with the sync confirmation message
          svg_content = """<svg xmlns="http://www.w3.org/2000/svg" width="600" height="395" viewBox="0 0 600 395">
            <defs>
              <style>
                .terminal { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
                .prompt { fill: #58a6ff; font-weight: bold; }
                .cmd { fill: #f0883e; }
                .success { fill: #3fb950; }
                .critical { fill: #f85149; font-weight: bold; }
                .high { fill: #f0883e; }
                .info { fill: #8b949e; }
                .border { fill: #21262d; }
                .title { fill: #8b949e; font-size: 11px; }
              </style>
            </defs>
            <rect width="600" height="395" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
            <path d="M0,8 A8,8 0 0,1 8,0 H592 A8,8 0 0,1 600,8 V30 H0 Z" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
            <circle cx="20" cy="15" r="6" fill="#f85149" /><circle cx="40" cy="15" r="6" fill="#f0883e" /><circle cx="60" cy="15" r="6" fill="#3fb950" />
            <text x="300" y="19" class="title" text-anchor="middle">voltron@sec-ops:~ (sh)</text>
            <g class="terminal" transform="translate(20, 55)">
              <text x="0" y="0"><tspan class="prompt">voltron@sec-ops:~$</tspan> <tspan class="cmd">./fetch-vulns.sh --disclosed</tspan></text>
              <text x="0" y="25" class="info">[i] Fetching vulnerability records from active platforms...</text>
              <text x="0" y="55" class="info">ID             | TARGET / VULNERABILITY                 | SEV / IMPACT</text>
              <text x="0" y="65" class="border">──────────────────────────────────────────────────────────────────────</text>
          """

          y_offset = 90
          for v in vulns:
              id_pad = v['id'].ljust(14)
              target_pad = v['target'].ljust(38)
              svg_content += f'\n    <text x="0" y="{y_offset}"><tspan class="{v["style"]}">{id_pad}</tspan> <tspan xml:space="preserve"> | {target_pad} | </tspan><tspan class="{v["style"]}">{v["sev"]}</tspan></text>'
              y_offset += 25

          svg_content += f"""
              <text x="0" y="{y_offset + 15}" class="border">──────────────────────────────────────────────────────────────────────</text>
              <text x="0" y="{y_offset + 45}" class="success">[✔] {len(vulns)} active advisories synced successfully.</text>
              <text x="0" y="{y_offset + 75}"><tspan class="prompt">voltron@sec-ops:~$</tspan> <tspan class="cmd">_</tspan></text>
            </g>
          </svg>"""

          with open("terminal.svg", "w") as f:
              f.write(svg_content)
          EOF
          python generate_svg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update terminal graphics with latest CVE configurations" && git push)
